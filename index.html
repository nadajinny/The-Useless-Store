<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Useless Store Run - 모드 선택</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      html, body { height: 100%; margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans KR', Arial, sans-serif; color:#fff; }
      .wrap { min-height:100%; display:flex; align-items:center; justify-content:center; position: relative; z-index: 4; }
      .panel { width:min(720px, 92vw); padding:40px 28px; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.12); border-radius:16px; box-shadow:0 10px 30px rgba(0,0,0,0.35); }
      h1 { margin:0 0 12px; font-size:28px; }
      p.desc { margin:0 0 20px; color:#cfd3e0; }
      .actions { display:flex; gap:12px; flex-wrap:wrap; }
      .btn { appearance:none; border:none; padding:14px 18px; border-radius:10px; cursor:pointer; font-weight:700; font-size:16px; text-decoration:none; display:inline-block; }
      .btn-primary { background:#5b8cff; color:#fff; }
      .btn-ghost { background:transparent; color:#cfd3e0; border:1px solid rgba(255,255,255,0.2); }
      .btn[disabled] { opacity:0.55; pointer-events:none; }
      .tabs { display:flex; gap:10px; margin-bottom:14px; }
      .tab { flex:0 0 auto; }
      .tab .btn { background:rgba(255,255,255,0.06); color:#e8ecf6; border:1px solid rgba(255,255,255,0.18); }
      .tab .btn.active { background:#5b8cff; color:#fff; border-color:transparent; }
      .detail { margin-top:8px; padding-top:8px; border-top:1px solid rgba(255,255,255,0.12); }
      .detail h2 { margin:10px 0 8px; font-size:18px; }
      .detail ul { margin:0 0 12px 18px; padding:0; color:#cfd3e0; }
      .detail ul li { margin:3px 0; }
      .hint { margin-top:16px; font-size:12px; color:#aab0c2; }

      /* 정지 프리뷰: 실제 게임 레이아웃을 iframe으로 그려 스케일 차이 문제 제거 */
      .stage { position: fixed; inset: 0; z-index: 1; overflow: hidden; pointer-events: none; }
      .stage iframe { width: 100%; height: 100%; border: 0; }
    </style>
  </head>
  <body>
    <!-- 엄마의 분노 모드와 동일한 캔버스 컨테이너(#game) + 오버레이 사용 -->
    <div id="game">
      <div class="overlay visible" id="modeScreen">
        <div>
          <h1>Useless Store Run</h1>
          <p class="desc">원하는 모드를 먼저 선택하세요. 아래에 설명과 시작 버튼이 나타납니다.</p>
          <div class="tabs">
            <div class="tab"><button id="tabMom" class="btn">엄마의 분노</button></div>
            <div class="tab"><button id="tabScore" class="btn">점수제</button></div>
          </div>
          <div id="detail" class="detail" style="display:none;">
            <h2 id="modeTitle">모드</h2>
            <ul id="modeDesc"></ul>
            <div class="actions">
              <a id="startLink" class="btn btn-primary" href="#" disabled>게임 시작</a>
            </div>
            <p class="hint">점수 저장/랭킹</p>
          </div>
        </div>
      </div>
    </div>
    <script>
      const MODES = {
        mom: {
          title: '엄마의 분노',
          url: 'mom.html',
          desc: [
            '엄마와의 거리 게이지가 0이 되기 전에 버텨라',
            '아이템을 담아 점수/콤보를 올리고 거리를 벌리자',
            '용량을 넘기면 콤보/속도 초기화 (페널티)'
          ],
        },
        score: {
          title: '점수제',
          url: 'score.html',
          desc: [
            '시작 전 메모에 적힌 상품만 +1점',
            '타이머가 0이 되면 종료, 총점으로 승부',
            '게임 진행/조작은 기본 모드와 동일'
          ],
        }
      };
      const tabMom = document.getElementById('tabMom');
      const tabScore = document.getElementById('tabScore');
      const detail = document.getElementById('detail');
      const title = document.getElementById('modeTitle');
      const list = document.getElementById('modeDesc');
      const startLink = document.getElementById('startLink');
      function select(mode){
        const m = MODES[mode];
        if (!m) return;
        tabMom.classList.toggle('active', mode==='mom');
        tabScore.classList.toggle('active', mode==='score');
        title.textContent = m.title;
        list.innerHTML = '';
        m.desc.forEach(t=>{ const li=document.createElement('li'); li.textContent=t; list.appendChild(li); });
        startLink.setAttribute('href', m.url);
        startLink.removeAttribute('disabled');
        detail.style.display = 'block';
      }
      tabMom.addEventListener('click', ()=>select('mom'));
      tabScore.addEventListener('click', ()=>select('score'));
    </script>
  </body>
  </html>
